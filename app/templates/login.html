<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHOOP Dashboard · Sign in</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--muted:#6b7280;--line:#e5e7eb;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f12;--card:#161a20;--ink:#e8eaed;--muted:#9aa3af;--line:#262b33;--red:#ef4444}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(340px,90vw);display:grid;gap:12px}
h1{font-size:18px;margin:0}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{color:var(--red);font-size:13px;margin:0}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>WHOOP Dashboard</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>

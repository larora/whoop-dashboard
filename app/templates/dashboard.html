<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHOOP Health Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f4c66'/%3E%3Cpath d='M4 12h3.5l2-5 4 10 2-5H20' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Sea-blue theme. Light: pale sea background with white cards. Dark: deep sea background with lighter teal cards.
   Follows the system setting; the ☀/☾ button in the header overrides it (saved in this browser). */
:root{
  --bg:#d6e9f0;--card:#fff;--ink:#102a36;--muted:#4f6e7c;--line:#c6dde6;--grid:#e8f2f6;
  --green:#15803d;--yellow:#ca9a04;--red:#dc2626;--blue:#1d6fd1;--purple:#7c3aed;--teal:#0f8f86;--orange:#ea680c;
  --light:#8ec5f5;--sws:#7c3aed;--rem:#1fc4e0;--accent:#0f4c66;
}
:root[data-theme="dark"]{
  --bg:#0a2634;--card:#11394b;--ink:#e6f1f5;--muted:#93b4c2;--line:#1d4b60;--grid:#174357;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;
  --light:#3b82f6;--sws:#8b5cf6;--rem:#22d3ee;--accent:#e6f1f5;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a2634;--card:#11394b;--ink:#e6f1f5;--muted:#93b4c2;--line:#1d4b60;--grid:#174357;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;
  --light:#3b82f6;--sws:#8b5cf6;--rem:#22d3ee;--accent:#e6f1f5;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(16,42,54,.05),0 10px 28px -18px rgba(16,42,54,.28)}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:32px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .cmp{font-size:12px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.ico{flex:none;color:var(--muted)}.card h2 .ico{color:var(--ink);background:var(--grid);border-radius:8px;padding:5px;width:28px;height:28px}
.kpi .lbl .ico{vertical-align:-2px;margin-right:5px}.card h3 .ico{vertical-align:-2px;margin-right:4px}
h1{display:flex;align-items:center;gap:10px}.logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--bg)}
.card .note{color:var(--muted);font-size:12px;margin-bottom:8px}
.chart{position:relative;width:100%;height:240px}.chart.tall{height:300px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:2;box-shadow:0 6px 20px -6px rgba(0,0,0,.4)}
.insights{margin:0;padding-left:18px}.insights li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
.tbl{overflow-x:auto}
.rows{display:grid;gap:3px;min-width:260px;font-size:11px;line-height:13px}
.zr{display:grid;grid-template-columns:8px 36px 74px 1fr auto;align-items:center;gap:5px;color:var(--muted)}.zr .pc{color:var(--muted);font-weight:500}
.zr i{width:8px;height:8px;border-radius:2px}.zr b{color:var(--ink);font-weight:600}.zr small{font-size:11px;white-space:nowrap}
.zr .zb{height:9px;border-radius:3px;background:var(--grid);overflow:hidden}.zr .zb span{display:block;height:100%;border-radius:3px}
.zr em{font-style:normal;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap}
td.stages .rows{min-width:250px}
.nav{display:flex;align-items:center;gap:6px}.nav .btn{padding:5px 10px;font-size:16px;line-height:1}.period{font-size:13px;font-weight:600;min-width:140px;text-align:center}
tr:hover td{background:color-mix(in srgb,var(--grid) 60%,transparent)}
tr.exp{cursor:pointer}.caret{display:inline-block;width:14px;color:var(--muted)}
tr.splits td{background:var(--bg);padding:12px 14px}
.splitwrap{display:grid;gap:10px}.splitmeta{font-size:12px;color:var(--muted)}
.spchart{display:flex;align-items:flex-end;gap:6px;height:88px;padding:0 2px}
.sp{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-width:26px;max-width:56px}
.spv{font-size:10px;font-weight:600;margin-bottom:3px}.spb{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(var(--teal),color-mix(in srgb,var(--teal) 70%,transparent))}
.spk{font-size:10px;color:var(--muted);margin-top:3px}
.sptable{font-size:11px;width:auto}.sptable th{text-align:left;padding:3px 10px 3px 0;color:var(--muted)}.sptable td{padding:3px 8px;text-align:center;border-bottom:0;font-variant-numeric:tabular-nums}
.effs{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}.eff.pr{color:var(--green);font-weight:600}
.src{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--grid);color:var(--muted);white-space:nowrap}
.src.both{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}.src.strava{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.connect{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--accent);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.primary{font-size:15px;padding:10px 20px}
.btn:disabled{opacity:.6;cursor:default}
.spin{display:none;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.btn.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--red);font-size:12px}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 4px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini .lbl{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mini .val{font-size:22px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.mini .val small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.mini .cmp{font-size:11px;color:var(--muted)}
.edit{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px}
.vo2form{display:flex;gap:6px;margin-top:8px}.vo2form input{width:90px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.vo2form .btn{padding:5px 10px}
.vo2form[hidden]{display:none}
</style>
</head>
<body>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<div class="wrap">
  <header>
    <div><h1><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span>WHOOP Health Dashboard</h1><div class="sub" id="gen">Loading…</div></div>
    <div class="ctl">
      <div class="nav"><button class="btn ghost" id="prev" title="Earlier (←)">‹</button><span class="period" id="period"></span><button class="btn ghost" id="next" title="Later (→)">›</button></div>
      <div class="seg" id="range">
        <button data-d="7" class="on">7D</button><button data-d="30">30D</button><button data-d="90">90D</button><button data-d="180">6M</button><button data-d="365">1Y</button><button data-d="0">All</button>
      </div>
      <button class="btn" id="syncBtn" type="button"><span class="spin"></span><span class="txt">Sync now</span></button>
      <button class="btn ghost" id="theme" type="button" title="Light / dark">☾</button>
      <form method="post" action="/logout" style="margin:0"><button class="btn ghost" type="submit">Logout</button></form>
    </div>
  </header>
  <div id="root"></div>
</div>
<script src="/static/icons.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/sections.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>

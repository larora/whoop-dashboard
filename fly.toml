# Replace "whoop-dashboard" with the app name you pick in `fly launch`.
app = "whoop-dashboard"
primary_region = "bom"

[build]

[env]
  DATA_DIR = "/data"
  TZ = "Asia/Kolkata"
  SYNC_HOUR = "9"
  SYNC_MINUTE = "0"
  INITIAL_DAYS = "365"

[[mounts]]
  source = "whoop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # the in-process scheduler must stay alive
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
